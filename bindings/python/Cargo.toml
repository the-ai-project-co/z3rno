[workspace]

[package]
name = "z3rno"
version = "0.23.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "z3rno"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29" }
pythonize = "0.29.0"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
z3rno-engine = { path = "../../engine" }
