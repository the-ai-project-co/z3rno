name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: "cargo fmt --check (workspace: engine, server, cli)"
        run: cargo fmt --all -- --check

      # bindings/python and bindings/typescript are independent Rust crates
      # (PyO3 / napi-rs), not workspace members. Steps are skipped until
      # their Cargo.toml lands, then run automatically.
      - name: cargo fmt --check (bindings/python)
        if: hashFiles('bindings/python/Cargo.toml') != ''
        run: cargo fmt --manifest-path bindings/python/Cargo.toml -- --check

      - name: cargo fmt --check (bindings/typescript)
        if: hashFiles('bindings/typescript/Cargo.toml') != ''
        run: cargo fmt --manifest-path bindings/typescript/Cargo.toml -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: "cargo clippy (workspace: engine, server, cli)"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (bindings/python)
        if: hashFiles('bindings/python/Cargo.toml') != ''
        run: cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets -- -D warnings

      - name: cargo clippy (bindings/typescript)
        if: hashFiles('bindings/typescript/Cargo.toml') != ''
        run: cargo clippy --manifest-path bindings/typescript/Cargo.toml --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: "cargo test (workspace: engine, server, cli)"
        run: cargo test --workspace

      - name: cargo test (bindings/python)
        if: hashFiles('bindings/python/Cargo.toml') != ''
        run: cargo test --manifest-path bindings/python/Cargo.toml

      - name: cargo test (bindings/typescript)
        if: hashFiles('bindings/typescript/Cargo.toml') != ''
        run: cargo test --manifest-path bindings/typescript/Cargo.toml
