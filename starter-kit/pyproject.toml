[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "z3rno-starter-kit"
version = "0.1.0"
description = "Five worked examples of z3rno's persistent memory engine: chat memory, customer support, a SQL copilot, code memory, and a research notebook."
requires-python = ">=3.10"
dependencies = [
    "z3rno",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "mypy>=1.10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = "z3rno"
ignore_missing_imports = true
