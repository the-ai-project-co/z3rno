name: Release engine

# Placeholder release pipeline for the crates.io-published workspace crates
# (engine, server, cli). Publish step is a stub — wiring real `cargo publish`
# + crates.io trusted publishing OIDC is slice 0007's job.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release profile)
        run: cargo build --workspace --release

      - name: Publish to crates.io
        run: |
          echo "TODO: wire up crates.io trusted publishing (OIDC) in slice 0007"
          exit 0
