[workspace]

[package]
name = "z3rno-sdk-native"
version = "0.23.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = "2"
z3rno-engine = { path = "../../engine" }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"

[build-dependencies]
napi-build = "2"
