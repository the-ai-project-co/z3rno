name: CI (starter-kit)

# Builds the z3rno Python bindings from source via maturin (not published
# to PyPI yet) and runs the starter kit's examples end-to-end against the
# embedded backend, plus ruff/mypy. Independent of the main CI workflow.

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  starter-kit:
    name: starter-kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install maturin
        run: pip install maturin

      - name: Build z3rno Python bindings (maturin develop)
        run: maturin develop --manifest-path bindings/python/Cargo.toml

      - name: Install starter-kit
        run: pip install -e "starter-kit[dev]"

      - name: ruff check
        run: ruff check starter-kit

      - name: mypy
        run: mypy --config-file starter-kit/pyproject.toml starter-kit/src

      - name: pytest starter-kit
        run: pytest starter-kit
