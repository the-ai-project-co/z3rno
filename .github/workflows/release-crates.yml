name: Release crates

# Real publish pipeline for the crates.io-published workspace crates
# (engine, server, cli, hash-embed), replacing the earlier placeholder stub
# (release-engine.yml). Same tag trigger as release-bindings.yml so a
# single `v*.*.*` push releases every package together.
#
# Order matters: `cargo publish` requires a crate's path dependencies to
# already be live on crates.io before it can be published itself, so
# z3rno-engine and z3rno-hash-embed (both leaf crates, no workspace deps)
# go first in parallel, then z3rno-server (depends on the engine), then
# z3rno-cli last (depends on the engine, the server, and hash-embed).
#
# Supply-chain provenance (decision-doc 0006 / slice 0007.6): an SBOM is
# generated for every published crate and uploaded as a workflow artifact.
#
# Every publish step tolerates "already exists": crates.io versions are
# immutable, and this pipeline has genuinely needed re-running against the
# same tag (a downstream job failing after an upstream one already
# succeeded) — without this, a retry gets permanently stuck behind a crate
# that published fine the first time.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-engine:
    name: publish (z3rno-engine)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: |
          if ! output=$(cargo publish -p z3rno-engine 2>&1); then
            echo "$output"
            echo "$output" | grep -q "already exists" || exit 1
            echo "z3rno-engine already published at this version, treating as success"
          else
            echo "$output"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-hash-embed:
    name: publish (z3rno-hash-embed)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: |
          if ! output=$(cargo publish -p z3rno-hash-embed 2>&1); then
            echo "$output"
            echo "$output" | grep -q "already exists" || exit 1
            echo "z3rno-hash-embed already published at this version, treating as success"
          else
            echo "$output"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-server:
    name: publish (z3rno-server)
    needs: publish-engine
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # z3rno-engine was just published above; crates.io needs a moment to
      # index a freshly published crate before `cargo publish` on a
      # dependent crate can resolve it.
      - name: Wait for z3rno-engine to be indexed
        run: sleep 30

      - name: Publish to crates.io
        run: |
          if ! output=$(cargo publish -p z3rno-server 2>&1); then
            echo "$output"
            echo "$output" | grep -q "already exists" || exit 1
            echo "z3rno-server already published at this version, treating as success"
          else
            echo "$output"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-cli:
    name: publish (z3rno-cli)
    needs: [publish-server, publish-hash-embed]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Wait for z3rno-server to be indexed
        run: sleep 30

      - name: Publish to crates.io
        run: |
          if ! output=$(cargo publish -p z3rno-cli 2>&1); then
            echo "$output"
            echo "$output" | grep -q "already exists" || exit 1
            echo "z3rno-cli already published at this version, treating as success"
          else
            echo "$output"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  sbom:
    name: sbom
    needs: [publish-engine, publish-hash-embed, publish-server, publish-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      # Run from the workspace root: generates one CycloneDX SBOM per
      # workspace member (engine/bom.json, server/bom.json, cli/bom.json,
      # hash-embed/bom.json).
      - name: Generate SBOMs
        run: cargo cyclonedx --format json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            engine/bom.json
            server/bom.json
            cli/bom.json
            hash-embed/bom.json
