name: Release crates

# Real publish pipeline for the crates.io-published workspace crates
# (engine, server, cli), replacing the earlier placeholder stub
# (release-engine.yml). Same tag trigger as release-bindings.yml so a
# single `v*.*.*` push releases every package together.
#
# Order matters: `cargo publish` requires a crate's path dependencies to
# already be live on crates.io before it can be published itself, so
# z3rno-engine goes first, then z3rno-server (depends on the engine), then
# z3rno-cli last (depends on both).
#
# Supply-chain provenance (decision-doc 0006 / slice 0007.6): an SBOM is
# generated for every published crate and uploaded as a workflow artifact.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-engine:
    name: publish (z3rno-engine)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        run: cargo publish -p z3rno-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-server:
    name: publish (z3rno-server)
    needs: publish-engine
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # z3rno-engine was just published above; crates.io needs a moment to
      # index a freshly published crate before `cargo publish` on a
      # dependent crate can resolve it.
      - name: Wait for z3rno-engine to be indexed
        run: sleep 30

      - name: Publish to crates.io
        run: cargo publish -p z3rno-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-cli:
    name: publish (z3rno-cli)
    needs: publish-server
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Wait for z3rno-server to be indexed
        run: sleep 30

      - name: Publish to crates.io
        run: cargo publish -p z3rno-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  sbom:
    name: sbom
    needs: [publish-engine, publish-server, publish-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      # Run from the workspace root: generates one CycloneDX SBOM per
      # workspace member (engine/bom.json, server/bom.json, cli/bom.json).
      - name: Generate SBOMs
        run: cargo cyclonedx --format json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            engine/bom.json
            server/bom.json
            cli/bom.json
