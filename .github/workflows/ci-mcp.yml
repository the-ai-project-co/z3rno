name: CI (MCP server)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build bindings/python (maturin develop)
        run: maturin develop --manifest-path bindings/python/Cargo.toml

      - name: Install mcp/ (with dev extras)
        run: pip install -e "mcp[dev]"

      - name: pytest mcp/tests
        run: pytest mcp/tests
