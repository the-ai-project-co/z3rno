[package]
name = "z3rno-engine"
version = "0.23.0"
edition = "2021"
license = "Apache-2.0"
description = "Embeddable memory engine for AI agents: store, recall, forget, and audit over vector search and a knowledge graph, backed by SQLite or Postgres."
repository = "https://github.com/the-ai-project-co/z3rno"
readme = "README.md"
keywords = ["memory", "vector-search", "embeddings", "knowledge-graph", "ai-agents"]
categories = ["database", "asynchronous"]

[lib]
name = "z3rno_engine"
path = "src/lib.rs"

[features]
testing = []

[dependencies]
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
petgraph = "0.6"
hnsw_rs = "0.3.4"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
